[package]
name = "leaf-win"
description = "Win32 창·컨트롤 + Direct2D/DirectWrite 렌더러 — unsafe는 이 크레이트에만"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fmt-image"]
# 포맷 레지스트리(SPEC §4.3)에 이미지 보기를 넣는다
fmt-image = ["dep:leaf-fmt-image"]

[dependencies]
leaf-core.workspace = true
leaf-doc.workspace = true
leaf-fmt-pdf.workspace = true
leaf-fmt-text.workspace = true
leaf-fmt-markdown.workspace = true
leaf-fmt-image = { workspace = true, optional = true }
leaf-layout.workspace = true
crossbeam-channel.workspace = true
encoding_rs = "0.8.44"
windows-numerics = "0.3.1"
# `#[implement]`(DirectWrite 인라인 객체)가 windows_core 경로를 요구한다
windows-core = "0.62.2"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
