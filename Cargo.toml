[workspace]
resolver = "3"
members = [
    "crates/leaf-doc",
    "crates/leaf-core",
    "crates/leaf-fmt-pdf",
    "crates/leaf-fmt-text",
    "crates/leaf-win",
    "crates/leaf-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
leaf-doc = { path = "crates/leaf-doc" }
leaf-core = { path = "crates/leaf-core" }
leaf-fmt-pdf = { path = "crates/leaf-fmt-pdf" }
leaf-fmt-text = { path = "crates/leaf-fmt-text" }
leaf-win = { path = "crates/leaf-win" }
crossbeam-channel = "0.5.17"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
windows = "0.62.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # 파서 패닉 격리 (SPEC §6.2)
